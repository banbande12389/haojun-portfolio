name: Publish portfolio to GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download complete website
        run: |
          curl --fail --location --retry 3 --output website.zip https://github.com/banbande12389/haojun-portfolio/releases/download/website-v1/website.zip
          echo 'd0588537681655037d6abe8df779fbb8481bbd3f783a5e1d4c7d8eb6b4edc009  website.zip' | sha256sum --check
          mkdir dist
          unzip -q website.zip -d dist
          test -f dist/index.html
          test -f dist/media/work-aigc-animation.mp4
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
